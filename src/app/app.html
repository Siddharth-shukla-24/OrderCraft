<div class="shell" [class.nav-open]="navOpen()" [class.collapsed]="collapsed()">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">OC</div>
      <div>
        <div class="brand-name">OrderCraft</div>
        <div class="brand-sub">Enterprise Edition</div>
      </div>
    </div>

    <nav>
      @for (item of nav; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" (click)="navOpen.set(false)">
          <span class="ico">{{ item.icon }}</span>{{ item.label }}
        </a>
      }
    </nav>

    <div class="foot">
      <div class="foot-version">
        <span class="online-dot"></span>
        Order Management System v2.0
      </div>
    </div>
  </aside>

  <div class="backdrop" (click)="navOpen.set(false)"></div>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu" type="button" aria-label="Toggle navigation" (click)="toggleNav()">☰</button>
        <span class="title">Manufacturing Order Management</span>
      </div>
      <div class="topbar-right">
        <span class="user">
          <span class="avatar">A</span>
          Admin
        </span>
      </div>
    </header>
    <main class="content"><router-outlet /></main>
  </div>
</div>
