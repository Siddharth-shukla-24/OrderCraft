spring.application.name=ordercraft-backend
server.port=8080

# Oracle connection. All three variables are REQUIRED; there are no defaults and no credentials in source.
spring.datasource.url=${ORDERCRAFT_DB_URL}
spring.datasource.username=${ORDERCRAFT_DB_USERNAME}
spring.datasource.password=${ORDERCRAFT_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Schema is not generated by Hibernate; it will come from explicit SQL scripts (Stage 2).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Angular dev server
ordercraft.cors.allowed-origins=http://localhost:4200